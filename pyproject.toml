[project]
name = "etf-optimizer"
version = "0.1.0"
description = "Research-backed multicriteria ETF selection, portfolio optimization, rebalancing, and walk-forward backtesting."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Juan Felipe Tamayo Mejía / Hermes Agent"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "yfinance>=0.2.40",
  "requests>=2.31",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
